<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Casinha nova</title>
<style>
:root{color-scheme:light dark;--bg:#faf7f2;--card:#fff;--tx:#2b2622;--mu:#7a7068;--ac:#c2563b;--ln:#e8e0d6;--ok:#2f7d4f;--bad:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1917;--card:#26221f;--tx:#f1ebe4;--mu:#a69b91;--ac:#e07a5f;--ln:#3a342f;--ok:#6fcf97;--bad:#f2867f}}
:root[data-theme="dark"]{--bg:#1c1917;--card:#26221f;--tx:#f1ebe4;--mu:#a69b91;--ac:#e07a5f;--ln:#3a342f;--ok:#6fcf97;--bad:#f2867f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:900px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.6rem;margin:0 0 2px}h2{font-size:1.1rem;margin:28px 0 10px}
.sub{color:var(--mu);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
input,select,textarea,button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:8px 10px;min-width:0}
button{cursor:pointer;background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
button.g{background:transparent;color:var(--mu);border-color:var(--ln);font-weight:400}
label{font-size:.8rem;color:var(--mu);display:block;margin-bottom:2px}
.lot{margin-top:10px}.lot h3{margin:0;font-size:1rem}
.price{font-size:1.3rem;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{font-size:.8rem;border:1px solid var(--ln);border-radius:99px;padding:2px 9px;color:var(--mu)}
.chip.ok{color:var(--ok);border-color:var(--ok)}.chip.bad{color:var(--bad);border-color:var(--bad)}
.dim{opacity:.55}
a{color:var(--ac)}
.step{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--ln)}
.step input{width:20px;height:20px}
.bar{height:8px;background:var(--ln);border-radius:9px;overflow:hidden;margin:6px 0 10px}.bar i{display:block;height:100%;background:var(--ok)}
.note{color:var(--mu);font-size:.85rem;margin-top:24px}
</style>
</head>
<body>
<main>
<h1>🏡 Casinha nova</h1>
<p class="sub">Compare terrenos e acompanhe cada etapa do projeto.</p>

<div class="card row">
  <div><label>Orçamento máximo do terreno (R$)</label><input id="budget" type="number" min="0" step="5000"></div>
  <div id="sum" style="flex:1;min-width:180px"></div>
</div>

<h2>Adicionar terreno</h2>
<div class="card">
  <div class="grid">
    <div><label>Bairro / apelido</label><input id="n" placeholder="Ex.: Nambi"></div>
    <div><label>Cidade</label><select id="c"></select></div>
    <div><label>Preço (R$)</label><input id="p" type="number" min="0"></div>
    <div><label>Área (m²)</label><input id="a" type="number" min="0"></div>
    <div><label>Relevo</label><select id="r"></select></div>
    <div><label>Condomínio/mês (R$)</label><input id="k" type="number" min="0"></div>
    <div style="grid-column:1/-1"><label>Link do anúncio</label><input id="l" placeholder="https://" style="width:100%"></div>
    <div style="grid-column:1/-1"><label>Observações</label><input id="o" placeholder="Ex.: perto do centro? Documentação em dia?" style="width:100%"></div>
    <div style="grid-column:1/-1"><label>Infraestrutura do bairro (marque o que existe)</label><div id="infra" class="row" style="gap:4px 14px"></div></div>
  </div>
  <p style="margin:10px 0 0"><button onclick="addLot()">Adicionar</button></p>
</div>

<h2>Terrenos</h2>
<div class="row">
  <select id="fc" onchange="render()"></select>
  <select id="fs" onchange="render()"></select>
  <select id="fr" onchange="render()"></select>
  <select id="fo" onchange="render()">
    <option value="p">Menor preço</option><option value="m">Menor R$/m²</option><option value="a">Maior área</option><option value="n">Mais recentes</option><option value="i">Melhor infraestrutura</option>
  </select>
  <label style="display:flex;gap:6px;align-items:center;margin:0"><input type="checkbox" id="fb" onchange="render()"> só dentro do orçamento</label>
</div>
<div id="list"></div>

<h2>Etapas da casa</h2>
<div class="card">
  <div id="prog"></div>
  <div id="steps"></div>
</div>

<p class="note">Os dados ficam salvos só neste aparelho e navegador. Para usar em outro lugar, é preciso inserir de novo.</p>
</main>

<script>
const KEY='casinha-v1';
const CITIES=['Jundiaí','Louveira','Itupeva'];
const REL=['Plano','Leve declive','Aclive','Declive','Não sei'];
const ST=['Em análise','Para visitar','Visitado','Proposta feita','Descartado'];
const STEPS=['Escolher o terreno','Visitar e conferir o relevo','Conferir matrícula e documentação','Definir o orçamento da obra','Simular o financiamento','Contratar projeto (arquiteto/engenheiro)','Aprovar na prefeitura (alvará)','Contratar a obra','Acompanhar a obra','Habite-se e mudança'];
const INFRA=['Rua asfaltada','Água','Esgoto','Energia e iluminação','Internet','Mercado/padaria perto','Escola perto','Posto de saúde perto','Transporte público','Sem risco de alagamento','Sensação de segurança'];
const OPEN={};
const sc=x=>(x.inf||[]).reduce((s,v)=>s+(v?1:0),0)/INFRA.length;
const infraHtml=x=>{
  const a=x.inf||INFRA.map(()=>0),p=sc(x),miss=INFRA.filter((t,k)=>!a[k]);
  const L=!x.inf?['Infraestrutura não avaliada','']:p>=.8?['Bairro ótimo · '+Math.round(p*100)+'%','ok']:p>=.55?['Bairro bom · '+Math.round(p*100)+'%','']:['Falta infraestrutura · '+Math.round(p*100)+'%','bad'];
  return '<div class="chips"><span class="chip '+L[1]+'">'+L[0]+'</span><a style="font-size:.85rem" href="https://www.google.com/maps/search/?api=1&amp;query='+encodeURIComponent(x.n+' '+x.c)+'" target="_blank" rel="noopener noreferrer">ver no mapa</a></div>'
  +'<details'+(OPEN[x.id]?' open':'')+' ontoggle="OPEN['+x.id+']=this.open"><summary style="cursor:pointer;color:var(--mu);font-size:.85rem">Infraestrutura'+(x.inf&&miss.length?' · falta: '+miss.join(', '):'')+'</summary><div class="row" style="gap:4px 14px;margin-top:6px">'
  +INFRA.map((t,k)=>'<label style="display:flex;gap:6px;align-items:center;margin:0;color:var(--tx);font-size:.9rem"><input type="checkbox"'+(a[k]?' checked':'')+' onchange="tgi('+x.i+','+k+')"> '+t+'</label>').join('')+'</div></details>';
};
let S={budget:250000,lots:[],steps:STEPS.map(t=>({t,d:false}))};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
const opts=(a,sel,all)=>(all?'<option value="">'+all+'</option>':'')+a.map(x=>'<option'+(x===sel?' selected':'')+'>'+x+'</option>').join('');

$('c').innerHTML=opts(CITIES);$('r').innerHTML=opts(REL,'Não sei');
$('fc').innerHTML=opts(CITIES,'','Todas as cidades');
$('fs').innerHTML=opts(ST,'','Todos os status');
$('fr').innerHTML=opts(REL,'','Qualquer relevo');
$('budget').value=S.budget;
$('infra').innerHTML=INFRA.map((t,k)=>'<label style="display:flex;gap:6px;align-items:center;margin:0;color:var(--tx);font-size:.9rem"><input type="checkbox"> '+t+'</label>').join('');
$('budget').onchange=()=>{S.budget=+$('budget').value||0;save();render()};

function addLot(){
  const p=+$('p').value,a=+$('a').value;
  if(!p||!a){alert('Preencha pelo menos preço e área.');return}
  S.lots.push({id:Date.now(),n:$('n').value.trim()||'Sem nome',c:$('c').value,p:p,a:a,r:$('r').value,k:+$('k').value||0,l:$('l').value.trim(),o:$('o').value.trim(),s:'Em análise',inf:[...document.querySelectorAll('#infra input')].map(e=>e.checked?1:0)});
  ['n','p','a','k','l','o'].forEach(i=>$(i).value='');
  document.querySelectorAll('#infra input').forEach(e=>e.checked=false);
  save();render();
}
function upd(i,k,v){S.lots[i][k]=v;save();render()}
function tgi(i,k){const a=S.lots[i].inf||INFRA.map(()=>0);a[k]=a[k]?0:1;S.lots[i].inf=a;save();render()}
function del(i){if(confirm('Remover este terreno?')){S.lots.splice(i,1);save();render()}}
function tog(i){S.steps[i].d=!S.steps[i].d;save();render()}

function render(){
  const fc=$('fc').value,fs=$('fs').value,fr=$('fr').value,fb=$('fb').checked,fo=$('fo').value;
  const inB=S.lots.filter(x=>x.p<=S.budget&&x.s!=='Descartado').length;
  $('sum').innerHTML='<b>'+S.lots.length+'</b> terrenos salvos · <b>'+inB+'</b> dentro do orçamento';
  let L=S.lots.map((x,i)=>Object.assign({i:i},x)).filter(x=>(!fc||x.c===fc)&&(!fs||x.s===fs)&&(!fr||x.r===fr)&&(!fb||x.p<=S.budget));
  const f={p:(a,b)=>a.p-b.p,m:(a,b)=>a.p/a.a-b.p/b.a,a:(a,b)=>b.a-a.a,n:(a,b)=>b.id-a.id,i:(a,b)=>sc(b)-sc(a)}[fo];
  L.sort(f);
  $('list').innerHTML=L.length?L.map(x=>{
    const over=x.p>S.budget;
    const link=/^https?:\/\//.test(x.l)?' · <a href="'+esc(x.l)+'" target="_blank" rel="noopener noreferrer">ver anúncio</a>':'';
    return '<div class="card lot'+(x.s==='Descartado'?' dim':'')+'">'
    +'<div class="row" style="justify-content:space-between"><h3>'+esc(x.n)+' · '+esc(x.c)+'</h3><div class="price">'+brl(x.p)+'</div></div>'
    +'<div class="chips"><span class="chip">'+x.a+' m²</span><span class="chip">'+brl(x.p/x.a)+'/m²</span>'
    +'<span class="chip'+(x.r==='Plano'?' ok':'')+'">'+esc(x.r)+'</span>'
    +(x.k?'<span class="chip">cond. '+brl(x.k)+'/mês</span>':'')
    +'<span class="chip '+(over?'bad':'ok')+'">'+(over?'acima do orçamento (+'+brl(x.p-S.budget)+')':'dentro do orçamento')+'</span></div>'
    +(x.o?'<div>'+esc(x.o)+'</div>':'')+infraHtml(x)
    +'<div class="row" style="margin-top:8px"><select onchange="upd('+x.i+',\'s\',this.value)">'+opts(ST,x.s)+'</select>'
    +'<select onchange="upd('+x.i+',\'r\',this.value)">'+opts(REL,x.r)+'</select>'
    +'<button class="g" onclick="del('+x.i+')">Remover</button><span>'+link.replace(/^ · /,'')+'</span></div></div>';
  }).join(''):'<p class="sub" style="margin-top:12px">Nenhum terreno por aqui ainda.</p>';
  const d=S.steps.filter(s=>s.d).length;
  $('prog').innerHTML='<b>'+d+' de '+S.steps.length+'</b> etapas concluídas<div class="bar"><i style="width:'+(d/S.steps.length*100)+'%"></i></div>';
  $('steps').innerHTML=S.steps.map((s,i)=>'<label class="step" style="font-size:1rem;color:inherit;margin:0"><input type="checkbox"'+(s.d?' checked':'')+' onchange="tog('+i+')"><span'+(s.d?' class="dim" style="text-decoration:line-through"':'')+'>'+esc(s.t)+'</span></label>').join('');
}
render();
</script>
</body>
</html>
